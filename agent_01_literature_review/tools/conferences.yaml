# ---------------------------------------------------------------------------
# American Accounting Association (AAA) meetings
#
# The paper-level page is the meeting's "Program" page:
#   https://aaahq.org/Meetings/{year}/{slug}/Program
# On public program pages each session lists: session code + topic, moderator,
# then for each paper: title, authors with affiliations, "Discussant: name, affiliation".
# Slugs change across years, so `slugs` maps year -> slug. `program_pages` lists
# verified paper-level URLs (some meetings use non-standard program paths).
# Checked 2026-10-20; "papers" = count of "Discussant" entries on the page (~ number of papers).
# ---------------------------------------------------------------------------

aaa_meetings:
  - id: aaa_annual
    name: AAA Global Connect (Annual Meeting until 2025)
    typical_month: August
    slugs: {2015-2025: Annual-Meeting, 2026-2027: AAA-Global-Connect}
    access: members_only
    program_pages:
      2026: https://aaahq.org/Meetings/2026/AAA-Global-Connect/Program/Concurrent-Sessions?dID=01
      2025: https://aaahq.org/Meetings/2025/Annual-Meeting/Program/Concurrent-Sessions?dID=1
    notes: >
      Concurrent-session pages (dID=01..08, 101..103) show no papers without login, even in a browser.
      The program PDF with abstracts (/Program-pdfs) is attendee-only. Export manually to inputs/conference_programs/.
      From 2026 the DATA and Sustainability conferences are folded into Global Connect.
    verified: 2026-10-20

  - id: aaa_fars
    name: Financial Accounting and Reporting Section (FARS) Midyear Meeting
    typical_month: January
    slugs: {2016-2018: Financial-Accounting-And-Reporting-Section, 2019-2020: Financial-Accounting-and-Reporting-Section, 2025-2027: FARS-Midyear-Meeting}
    access: public_papers
    program_pages:
      2026: https://aaahq.org/Meetings/2026/FARS-Midyear-Meeting/Program   # ~136 papers
      2025: https://aaahq.org/Meetings/2025/FARS-Midyear-Meeting/Program   # ~135 papers
    notes: 2021-2024 slug not found in AAA archive; older programs were on All Academic (https://convention2.allacademic.com/one/aaa/fars23/).
    verified: 2026-10-20

  - id: aaa_auditing
