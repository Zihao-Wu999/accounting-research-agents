# Curated list of accounting research conferences used by Agent 01.
#
# access:
#   public_papers   - program page lists paper titles (and often PDFs) without login
#   public_sessions - program is public but only at session level, no paper titles
#   members_only    - paper-level program requires login / attendee access
#   cfp_only        - only call for papers is published; program not found online
#   unverified      - not yet checked
# verified: date this entry was last checked by hand (YYYY-MM-DD)
#
# Discovery feed: the EAA Accounting Research Calendar (https://eaa-online.org/arc/) aggregates
# calls for papers for most conferences below; see fetch_conference_calendar.py.
# SSRN's ARN conference pages are stale (archive ends 2019, announcements end 2018) and are not used.

conferences:
  - id: jar
    name: Ray Ball Journal of Accounting Research Conference
    organizer: Chicago Booth / JAR
    typical_month: May
    homepage: https://www.chicagobooth.edu/research/chookaszian/events/jar-conference
    access: public_papers
    notes: Invitation only. 2026 page lists 7 papers with conference-version PDFs and a schedule PDF.
    verified: 2026-10-20

  - id: jae
    name: Journal of Accounting and Economics Conference
    organizer: JAE (host school rotates; 2026 UNC Kenan-Flagler, 2027 Rochester)
    typical_month: October-November
    homepage: https://eaa-online.org/arc/?p=6649
    access: cfp_only
    notes: Invitation only; host school posts the program. Papers later appear in the JAE conference issue.
    verified: 2026-10-20

